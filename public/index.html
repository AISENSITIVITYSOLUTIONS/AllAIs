<!doctype html>
<html lang="es">
  <head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-N00TZN76TS"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-N00TZN76TS');
    </script>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AllAIs | NNI</title>
    <link rel="stylesheet" href="/styles.css?v=31" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark">
            <img src="/assets/nni-logo.svg" alt="NNI" />
          </div>
          <div>
            <strong>AllAIs</strong>
            <span>NNI – Neural Network Initiative</span>
          </div>
        </div>

        <button class="new-chat" id="newChatButton">
          <span class="new-chat-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" role="img">
              <path d="M5 19h11.5" />
              <path d="M5 19V7.5A2.5 2.5 0 0 1 7.5 5H14" />
              <path d="M9.2 14.8 18.4 5.6a1.7 1.7 0 0 1 2.4 2.4l-9.2 9.2-3.1.7.7-3.1Z" />
            </svg>
          </span>
          Nueva consulta
        </button>

        <section class="panel">
          <p class="panel-label" id="accessPanelLabel">Acceso</p>
          <div class="login-box" id="loginBox">
            <div class="password-field">
              <input id="accessCodeInput" type="password" placeholder="Código de acceso" autocomplete="off" />
              <button type="button" class="password-toggle" id="toggleAccessVisibility" aria-label="Mostrar código">👁</button>
            </div>
            <button id="loginButton">Entrar</button>
          </div>
          <p class="session-state" id="sessionState">Sesión no iniciada</p>
        </section>

        <section class="panel">
          <p class="panel-label" id="providersPanelLabel">Modelos conectables</p>
          <div class="provider-list" id="providerList"></div>
        </section>

        <section class="panel quiet">
          <p class="panel-label" id="platformPanelLabel">Plataforma</p>
          <p id="platformDescription">Un gateway profesional para operar modelos de IA sin exponer claves privadas ni perder control del uso.</p>
        </section>
      </aside>

      <main class="workspace">
        <div class="mode-switch" aria-label="Modo de trabajo">
          <span>Chat</span>
          <strong>Work</strong>
        </div>

        <div class="language-switch" aria-label="Idioma">
          <button type="button" class="language-button" data-lang="en" aria-label="English">
            <img class="flag-icon" src="/assets/flag-uk.png" alt="" aria-hidden="true" />
            <span>EN</span>
          </button>
          <button type="button" class="language-button active" data-lang="es" aria-label="Español">
            <img class="flag-icon" src="/assets/flag-mx.png" alt="" aria-hidden="true" />
            <span>ES</span>
          </button>
          <button type="button" class="language-button" data-lang="fr" aria-label="Français">
            <img class="flag-icon" src="/assets/flag-fr.png" alt="" aria-hidden="true" />
            <span>FR</span>
          </button>
        </div>

        <section class="hero">
          <div>
            <h2 id="heroTitle">¿Qué quieres hacer?</h2>
          </div>
        </section>

        <section class="chat-card">
          <div class="conversation" id="conversation"></div>
        </section>

        <form class="prompt-workbench" id="promptForm">
          <div class="task-grid" id="taskGrid" aria-label="Tipo de tarea">
            <button type="button" class="task-card active" data-task="write">
              <strong>Escribir</strong>
            </button>
            <button type="button" class="task-card" data-task="learn">
              <strong>Aprender</strong>
            </button>
            <button type="button" class="task-card" data-task="research">
              <strong>Investigar</strong>
            </button>
            <button type="button" class="task-card" data-task="analyze">
              <strong>Analizar</strong>
            </button>
            <button type="button" class="task-card" data-task="summarize">
              <strong>Resumir</strong>
            </button>
            <button type="button" class="task-card" data-task="strategy">
              <strong>Crear estrategia</strong>
            </button>
            <button type="button" class="task-card" data-task="code">
              <strong>Programar</strong>
            </button>
            <button type="button" class="task-card" data-task="other">
              <strong>Otro</strong>
            </button>
          </div>

          <label class="web-search-option">
            <input type="checkbox" id="webSearchToggle" />
            <span id="webSearchLabel">Buscar en la web</span>
          </label>

          <div class="composer-input-row">
            <div class="attachment-control">
              <button type="button" class="attach-button" id="attachButton" data-tooltip="Add files and more" aria-label="Add files and more" aria-haspopup="menu" aria-expanded="false">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
              </button>
              <div class="attachment-menu" id="attachmentMenu" role="menu" hidden>
                <button type="button" role="menuitem" data-attachment-kind="file"></button>
                <button type="button" role="menuitem" data-attachment-kind="image"></button>
                <button type="button" role="menuitem" data-attachment-kind="video"></button>
              </div>
              <input id="attachmentInput" type="file" hidden multiple />
            </div>
            <textarea id="promptInput" rows="1" placeholder="Cuéntame qué necesitas hacer. Ejemplo: Necesito escribirle un mensaje a mi jefe para pedirle una reunión..."></textarea>
          </div>
          <div class="attachment-list" id="attachmentList" aria-live="polite" hidden></div>

          <div class="composer-footer">
            <span class="selected-provider-note" id="selectedProviderNote">ChatGPT / OpenAI</span>
            <button type="submit" id="sendButton">Continuar</button>
          </div>
        </form>

      </main>
    </div>

    <script src="/app.js?v=30"></script>
  </body>
</html>
